version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: swift
    directory: /Packages/SurimonoKit
    schedule:
      interval: weekly
    commit-message:
      prefix: build
