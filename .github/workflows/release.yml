name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing release tag
        id: release-tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/tags/$tag"
            tag_commit="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag points to $tag_commit, but this workflow builds $GITHUB_SHA. Choose the tagged commit or a new version."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check remote tag $tag (git ls-remote exited with $status)."
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - run: make test-kit
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER"
      # Developer ID signing and notarization can replace ad-hoc signing here in a future release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG_EXISTS: ${{ steps.release-tag.outputs.exists }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<'NOTES'
          このアプリはアドホック署名のため、初回起動時に Gatekeeper の警告が出ます。
          Finder で右クリック →「開く」、または `xattr -dr com.apple.quarantine Surimono.app` で起動できます。
          NOTES
          args=("v$VERSION" --title "Surimono $VERSION" --generate-notes --notes-file "$notes_file")
          if [[ "$EVENT_NAME" == "push" || "$TAG_EXISTS" == "true" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "build/release/Surimono-$VERSION.zip" "build/release/Surimono-$VERSION.zip.sha256"
