name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing release tag
        id: release-tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/tags/$tag"
            tag_commit="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag points to $tag_commit, but this workflow builds $GITHUB_SHA. Choose the tagged commit or a new version."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check remote tag $tag (git ls-remote exited with $status)."
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - run: make test-kit
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER"
      # Developer ID signing and notarization can replace ad-hoc signing here in a future release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG_EXISTS: ${{ steps.release-tag.outputs.exists }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<'NOTES'
          Surimono は Apple の公証を受けていない（アドホック署名の）ため、初回の起動で Gatekeeper の警告が出ます。macOS 15 以降は Finder の右クリック →「開く」では起動できないので、次の手順で開いてください。

          1. ZIP を展開し、Surimono.app を「アプリケーション」フォルダへ移す
          2. Surimono.app をダブルクリックし、警告が出たら「完了」で閉じる（「ゴミ箱に入れる」は押さない）
          3. アップルメニュー →「システム設定」→「プライバシーとセキュリティ」を開き、「セキュリティ」の欄にある「このまま開く」をクリックする（開こうとしてから約 1 時間だけ表示されます）
          4. 確認の画面で開くことを選び、ログインパスワードを入力する

          2 回目からはダブルクリックで開けます。詳しくは Apple のサポート記事「[Mac でアプリを安全に開く](https://support.apple.com/ja-jp/102445)」を参照してください。

          **ターミナルを使う場合**: `xattr -dr com.apple.quarantine /Applications/Surimono.app` でも開けるようになります。ダウンロードしたファイルに macOS が付ける隔離の印（拡張属性 `com.apple.quarantine`）を、アプリの中のファイルまで含めて（`-r`）消す（`-d`）コマンドです。印が消えると Gatekeeper はこのアプリを確かめずに起動させるので、入手元を信頼できるときだけ使ってください。
          NOTES
          args=("v$VERSION" --title "Surimono $VERSION" --generate-notes --notes-file "$notes_file")
          if [[ "$EVENT_NAME" == "push" || "$TAG_EXISTS" == "true" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "build/release/Surimono-$VERSION.zip" "build/release/Surimono-$VERSION.zip.sha256"
