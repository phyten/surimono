name: CI

on:
  push:
    branches: [master]
  pull_request:
    # labeled: adding the ci:test label starts the tests on a pull request that is already open.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# macOS runner minutes go to the build. Every run builds the package; the tests and the App Store check run only on a
# pull request that carries the label ci:test, or when the workflow is started by hand (which runs everything on any
# branch). Authors run lint and the tests locally (make lint, make test).
# The jobs run on runners of their own, so they run at the same time. GitHub runs at most five macOS jobs of the
# account at once, so keep five or fewer macOS jobs here. The job build-and-test is the required status check of the
# master ruleset: it waits for all of them and passes only when the package was built and no other job failed.
# A job stopped by its time limit fails that check, so each limit leaves a slow runner room: at least three times what
# the job takes on a typical runner, and 45 minutes for the hosted app tests, which took 12 minutes on a slow one.
jobs:
  lint-and-core:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:test'))
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: make lint
      - run: make test-tools
      - run: make test-formats
      - run: make test-core

  # The Rendering tests drive WebKit against timeouts, so they get a runner of their own and run one at a time on it
  # (see test-kit in the Makefile).
  rendering:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:test'))
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-rendering

  app-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:test'))
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-app
      # `make test-app` is quiet and names only the tests that failed. This prints what they said, from the result
      # bundle, so that a failure seen only on a runner can be read without running it again.
      - name: Show why tests failed
        if: failure()
        run: |
          bundle=$(ls -d build/DerivedData/Logs/Test/*.xcresult 2>/dev/null | tail -1)
          [ -n "$bundle" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/summary.json" || exit 0
          jq -r '"result: \(.result), passed: \(.passedTests), failed: \(.failedTests)",
            (.testFailures[]? | "FAIL \(.testName) | \(.failureText[0:1500])")' "$RUNNER_TEMP/summary.json" || true

  appstore:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:test'))
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-appstore

  package:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package BUILD_NUMBER="$BUILD_NUMBER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Surimono
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.sha256
          retention-days: 14
          if-no-files-found: error

  # A job whose needs fail is skipped, and a skipped required check counts as passing, so this job always runs.
  # always() rather than !cancelled() for the same reason: a cancelled run must not leave a skipped, and so passing,
  # check behind. The package must have been built. The optional jobs may be skipped (no ci:test label), but one that
  # ran and failed or was cancelled fails the check.
  build-and-test:
    needs: [lint-and-core, rendering, app-tests, appstore, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that the build succeeded and no job failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e '.package.result == "success"
              and all(del(.package)[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::The package was not built, or a job failed."
            exit 1
          fi
