name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: make lint
      - run: make test-kit
      - run: make test-app
      - run: make check-appstore
      - name: Package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make package BUILD_NUMBER="$BUILD_NUMBER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Surimono
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.sha256
          retention-days: 14
          if-no-files-found: error
